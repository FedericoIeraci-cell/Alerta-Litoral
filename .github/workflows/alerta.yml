name: Monitoreo Litoral - prueba del monitor anterior

# La programación y los envíos se concentran en ala-monitor.yml.
# Esta entrada histórica queda disponible como prueba manual sin mensajes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements_monitor.txt
      - name: Consulta integrada sin envios
        env:
          ALA_MONITOR_STATE_DIR: ${{ runner.temp }}/ala-prueba-legado
          TZ: America/Argentina/Buenos_Aires
        run: python verificar.py
