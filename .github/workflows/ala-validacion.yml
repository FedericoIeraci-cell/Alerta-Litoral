name: Alerta Litoral Agro - validar integracion

on:
  push:
    paths:
      - '*.py'
      - 'requirements_monitor.txt'
      - 'requirements_test.txt'
      - 'tests/**'
      - 'scripts/**'
      - 'ubicacion_local_frontend/**'
      - 'assets/leaflet/**'
      - 'assets/viirs/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '*.py'
      - 'requirements_monitor.txt'
      - 'requirements_test.txt'
      - 'tests/**'
      - 'scripts/**'
      - 'ubicacion_local_frontend/**'
      - 'assets/leaflet/**'
      - 'assets/viirs/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Instalar dependencias de prueba
        run: python -m pip install -r requirements_test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verificar ubicación con coordenadas sintéticas, sin permisos reales
        run: node tests/test_ubicacion_js.cjs
      - name: Verificar capa VIIRS sin consultas externas
        run: node --test tests/test_viirs_js.cjs
      - name: Verificar reglas y continuidad sin envios
        run: |
          python -m py_compile app.py mapa_litoral.py hidrometria_local.py hidrologia.py ctm.py monitor.py red_integrada.py portada_local.py ubicacion_local.py explicaciones_alerta.py siga_inta.py ficha_proyecto.py panel_proyecto.py decisiones_agro.py
          python -m unittest discover -s tests -v
      - name: Consultar fuentes del Litoral sin Telegram ni escritura remota
        env:
          ALA_MONITOR_STATE_DIR: ${{ runner.temp }}/ala-validacion
          PYTHONUNBUFFERED: '1'
          TZ: America/Argentina/Buenos_Aires
        run: |
          python monitor.py --dry-run --export-red "${{ runner.temp }}/red-integrada-prueba.json"

  publicar-red:
    # Al integrar una corrección, comprobar también la escritura real del informe.
    # Esta tarea no recibe credenciales de Telegram ni toca su SQLite.
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: ala-monitor-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements_monitor.txt
      - name: Publicar y releer informe sin Telegram
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALA_MONITOR_STATE_BRANCH: ala-monitor-state
          ALA_MONITOR_STATE_DIR: ${{ runner.temp }}/ala-publicacion
          PYTHONUNBUFFERED: '1'
          TZ: America/Argentina/Buenos_Aires
        run: python monitor.py --publish-red-only

