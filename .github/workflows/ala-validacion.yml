name: Alerta Litoral Agro - validar integracion

on:
  push:
    paths:
      - '*.py'
      - 'requirements_monitor.txt'
      - 'tests/**'
      - '.github/workflows/ala-validacion.yml'
  pull_request:
    paths:
      - '*.py'
      - 'requirements_monitor.txt'
      - 'tests/**'
      - '.github/workflows/ala-validacion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_monitor.txt
      - name: Instalar dependencias del monitor
        run: python -m pip install -r requirements_monitor.txt
      - name: Verificar reglas y continuidad sin envios
        run: |
          python -m py_compile app.py hidrologia.py ctm.py monitor.py red_integrada.py siga_inta.py ficha_proyecto.py panel_proyecto.py decisiones_agro.py
          python -m unittest discover -s tests -v
      - name: Consultar fuentes actuales sin Telegram ni escritura remota
        env:
          ALA_MONITOR_STATE_DIR: ${{ runner.temp }}/ala-validacion
          PYTHONUNBUFFERED: '1'
          TZ: America/Argentina/Buenos_Aires
        run: python monitor.py --dry-run

