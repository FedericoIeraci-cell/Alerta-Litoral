# Guardar como .github/workflows/ala-monitor.yml en la rama predeterminada.
# monitor.py debe guardar cada reserva en ala-monitor-state ANTES de enviar
# a Telegram. Nunca usar cache/artifacts como registro principal de envios.
name: Alerta Litoral Agro - vigilancia

on:
  schedule:
    # Aproximadamente cada hora, todos los dias, incluida la noche.
    # Se evita el minuto 0 para reducir demoras por carga en GitHub Actions.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Probar los datos sin enviar avisos ni modificar el registro'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  # La misma exclusividad para ejecuciones programadas y manuales.
  group: ala-monitor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar el codigo de la rama principal
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_monitor.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements_monitor.txt

      - name: Evaluar localidades y enviar solo eventos nuevos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          ALA_MONITOR_STATE_BRANCH: ala-monitor-state
          ALA_MONITOR_FREQUENCY_MINUTES: '60'
          ALA_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          PYTHONUNBUFFERED: '1'
          TZ: America/Argentina/Buenos_Aires
        run: |
          if [ "$ALA_DRY_RUN" = "true" ]; then
            python monitor.py --dry-run
          else
            python monitor.py
          fi
